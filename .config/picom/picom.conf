## ----- General Settings ----- ##

# Available backends "xrender" "glx" "egl"
backend = "xrender";

dithered-present = false;
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
log-level = "error";

animations = false;

## ----- Shadows ----- ##

shadow = false;
shadow-radius = 7;
shadow-opacity = 0.25
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-color = "#000000"

## ----- Fading ----- ##

fading = false;
fade-in-step = 0.1;
fade-out-step = 0.1;
fade-delta = 6
no-fading-openclose = false
no-fading-destroyed-argb = false

## ----- Transparency ----- ##

frame-opacity = 1.0;
#inactive-dim-fixed = true

## ----- Corners ----- ##

corner-radius = 0

## ----- Rules ----- ##

@include "picom-rules.conf"
