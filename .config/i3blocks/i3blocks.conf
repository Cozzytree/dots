# i3blocks configuration file
#
# The i3blocks man page describes the usage of the binary,
# and its website describes the configuration:
#
#     https://vivien.github.io/i3blocks


# Global properties
separator=true
separator_block_width=15

[network]
command=/home/$USER/.config/i3blocks/scripts/net.sh
color=#20ef40
interval=10

[net_speed]
command=/home/$USER/.config/i3blocks/scripts/net_speed.sh
min_width=80
align=left
color=#20ef40
interval=3

[volume]
min_width=50
command=/home/$USER/.config/i3blocks/scripts/volume.sh
LABEL=♪
#LABEL=VOL
interval=1
signal=10
#STEP=5%
MIXER=default
#SCONTROL=[determined automatically]
#NATURAL_MAPPING=0

[brightness]
min_width=50
command=/home/$USER/.config/i3blocks/scripts/brightness.sh
color=#5060ff
interval=once
signal=11

[battery]
command=/home/$USER/.config/i3blocks/scripts/battery.sh
interval=10

[cpu]
min_width=50
align=center
command=/home/$USER/.config/i3blocks/scripts/cpu.sh
interval=3

[memory]
command=/home/$USER/.config/i3blocks/scripts/mem.sh
interval=30

[disk]
command=/home/$USER/.config/i3blocks/scripts/disk.sh
#DIR=$HOME
#ALERT_LOW=10
interval=30

[time]
command=date '+%Y-%m-%d %H:%M'
interval=60
color=#00ff10

[powermenu]
command=/home/$USER/.config/i3blocks/scripts/powermenu.sh
LABEL=⏻
interval=once
