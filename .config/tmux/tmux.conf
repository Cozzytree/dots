# ==========================
# General Settings
# ==========================

# Enable mouse support (scrolling, pane resizing, clicking)
set -g mouse on

# Change prefix from 'Ctrl+B' to 'Ctrl+Space'
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Start window and pane numbering at 1 (easier to reach)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Fix colors in tmux (TrueColor support)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ==========================
# Minimal Dark Status Line
# ==========================
set -g status-position bottom
set -g status-justify left

# Base status bar styling (naysayer teal background, tan text)
set -g status-style "bg=#062329,fg=#d1b897"

# Left side of the status bar (Session name)
set -g status-left " #[bg=#11494c,fg=#ffffff,bold] #S #[default] "
set -g status-left-length 20

# Right side of the status bar (Date and Time)
set -g status-right " #[fg=#a89379,bold]%a %Y-%m-%d #[fg=#ffffff,bold]%H:%M "
set -g status-right-length 40

# Inactive window format
set -g window-status-format "  #I:#W  "
set -g window-status-style "fg=#a89379"

# Active window format
set -g window-status-current-format "  #I:#W  "
set -g window-status-current-style "bg=#11494c,fg=#ffffff,bold"

# Pane borders
set -g pane-border-style "fg=#04171c"
set -g pane-active-border-style "fg=#11494c"
